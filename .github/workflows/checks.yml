name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --incremental false
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
        env:
          CI: 'true'
          BROWSERSLIST_IGNORE_OLD_DATA: 'true'
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: botplus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d botplus_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gdal python3-venv
      - run: /usr/bin/python3 -m venv /tmp/botplus-test
      # Reuse only the matching native GDAL bindings, not Ubuntu's Python package
      # namespace (which can shadow pip's zope packages used by gevent).
      - run: >-
          /tmp/botplus-test/bin/python -c
          "import os, sysconfig; os.symlink('/usr/lib/python3/dist-packages/osgeo', os.path.join(sysconfig.get_path('purelib'), 'osgeo'))"
      - run: >-
          /tmp/botplus-test/bin/pip install Flask==3.1.2 flask-cors flask-compress requests Pillow piexif minio
          'psycopg2-binary>=2.9.10,<3' 'gevent>=24.2.1' psycogreen==1.0.2
      - run: /tmp/botplus-test/bin/python -m unittest discover -s tests -v
        env:
          PROJ_NETWORK: 'OFF'
          REQUIRE_GDAL_TESTS: '1'
          REQUIRE_DATABASE_TESTS: '1'
          TEST_POSTGIS: '1'
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/botplus_test
  tools-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.tools -t botplus-tools:ci .
      - run: docker run --rm --network none botplus-tools:ci --help
      - run: >-
          docker run --rm --network none --env PYTHONPATH=/app
          --mount type=bind,src=${{ github.workspace }}/tests,dst=/checks,readonly
          --entrypoint python botplus-tools:ci /checks/tools_image_smoke.py
