services:
  # --- 1. База данных (PostGIS) ---
  db:
    user: "0:0"
    image: postgis/postgis:16-3.4-alpine
    restart: always
    shm_size: 2gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Заменено на именованный том
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 3. PgBouncer (Пулер соединений) ---
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      # Звездочка разрешает доступ ко всем базам, включая системную postgres
      DB_NAME: "*"
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
    ports:
      - "${PGBOUNCER_PORT}:6432"

  # --- 4. Основное приложение (Backend) ---
  app:
    image: ${BOTPLUS_IMAGE:-botplus-maps:local}
    user: root
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn --workers 4 --worker-class gevent --timeout 36000 --keep-alive 5 --bind 0.0.0.0:5000 "server.app:create_app()"
    depends_on:
      pgbouncer:
        condition: service_started
      db:
        condition: service_healthy
    environment: &app_environment
      PYTHONPATH: /app/server
      
      # Режим работы и CORS
      APP_ENV: ${APP_ENV}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS}
      
      # Безопасность и Куки
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRES_SECONDS: ${ACCESS_TOKEN_EXPIRES_SECONDS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      
      # Настройки БД
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_IDLE_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_TRANSACTION_TIMEOUT_MS:-10000}
      
      # Обычные файлы на локальном диске / подключённом NAS
      MEDIA_ROOT: /app/data/media
      TMPDIR: /app/data/temp
      CPL_TMPDIR: /app/data/temp
      IMPORT_STAGING_DIR: /app/data/import-staging
      IMPORT_PRODUCTS_DIR: /app/data/import-products
      LOCAL_SOURCE_ROOTS: '{"local":"/sources/local"}'

      # Настройки TiTiler
      TITILER_INTERNAL_URL: ${TITILER_INTERNAL_URL}
      
      # Пути 
      UPLOAD_FOLDER: ${UPLOAD_FOLDER}
      ORTHO_FOLDER: ${ORTHO_FOLDER}
      TEMP_FOLDER: ${TEMP_FOLDER}
      TASKS_FOLDER: ${TASKS_FOLDER}
      
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ${LOCAL_SOURCE_DIR:-./data/sources}:/sources/local:ro
      - ${HOST_UPLOADS_DIR:-./server/uploads}:${UPLOAD_FOLDER}
    ports:
      - "${APP_PORT}:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ${BOTPLUS_IMAGE:-botplus-maps:local}
    restart: unless-stopped
    command: [python, server/job_worker.py]
    mem_limit: 1g
    cpus: 2.0
    environment: *app_environment
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ${HOST_UPLOADS_DIR:-./server/uploads}:${UPLOAD_FOLDER}
      - ${LOCAL_SOURCE_DIR:-./data/sources}:/sources/local:ro
    depends_on:
      app:
        condition: service_healthy

  # --- 5. TiTiler (Tile Server) ---
  titiler:
    image: ghcr.io/developmentseed/titiler:0.18.5
    container_name: titiler
    ports:
      - "${TITILER_PORT}:80"
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data:ro
      - ${LOCAL_SOURCE_DIR:-./data/sources}:/sources/local:ro
    environment:
      - WEB_CONCURRENCY=2
      - MAX_WORKERS=2
      # --- Разрешаем CORS ---
      - TITILER_API_CORS_ORIGIN=*
      
      # --- Оптимизация GDAL ---
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=${CPL_VSIL_CURL_ALLOWED_EXTENSIONS}
      - GDAL_CACHEMAX=200
      - GDAL_DISABLE_READDIR_ON_OPEN=${GDAL_DISABLE_READDIR_ON_OPEN}
      - GDAL_INGESTED_BYTES_AT_OPEN=32768
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_VERSION=2
      - GDAL_HTTP_UNSAFESSL=${GDAL_HTTP_UNSAFESSL}

# --- ОБЪЯВЛЕНИЕ ИМЕНОВАННЫХ ТОМОВ ---
volumes:
  pg_data:
