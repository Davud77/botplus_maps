# Dedicated local stack. Does not read or mount the legacy deployment's data.
services:
  db:
    restart: unless-stopped
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: botplus
      POSTGRES_DB: botplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure_local.py}
    volumes:
      - local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U botplus -d botplus]
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.storage
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run configure_local.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run configure_local.py}
    volumes:
      - local_objects:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    image: botplus-local-app
    restart: unless-stopped
    build: .
    environment: &app_environment
      PYTHONPATH: /app/server
      APP_ENV: local
      APP_PORT: 5000
      DATABASE_URL: postgresql://botplus:${POSTGRES_PASSWORD}@db:5432/botplus
      SECRET_KEY: ${SECRET_KEY:?Run configure_local.py}
      JWT_SECRET: ${JWT_SECRET:?Run configure_local.py}
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: Lax
      SESSION_COOKIE_DOMAIN: ''
      CLIENT_ORIGINS: http://localhost:${APP_PORT:-5580},http://127.0.0.1:${APP_PORT:-5580}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: 'false'
      TITILER_INTERNAL_URL: http://titiler:80
      UPLOAD_FOLDER: /app/server/uploads
      ORTHO_FOLDER: /app/server/uploads/orthos
      TEMP_FOLDER: /app/data/temp/orthos
      TASKS_FOLDER: /app/data/tasks
      LOCAL_SOURCE_ROOTS: '{"local":"/sources/local"}'
      IMPORT_STAGING_DIR: /app/data/import-staging
      IMPORT_PRODUCTS_DIR: /app/data/import-products
      PROJ_NETWORK: 'OFF'
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
    ports:
      - '127.0.0.1:${APP_PORT:-5580}:5000'
    volumes:
      - local_uploads:/app/server/uploads
      - local_work:/app/data
      - ${LOCAL_SOURCE_DIR:-./data/sources}:/sources/local:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:5000/api/health]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    image: botplus-local-app
    restart: unless-stopped
    command: [python, server/job_worker.py]
    mem_limit: ${IMPORT_WORKER_MEMORY:-1g}
    cpus: ${IMPORT_WORKER_CPUS:-2.0}
    environment: *app_environment
    stop_grace_period: 30s
    volumes:
      - local_work:/app/data
      - local_uploads:/app/server/uploads
      - ${LOCAL_SOURCE_DIR:-./data/sources}:/sources/local:ro
    depends_on:
      app:
        condition: service_healthy
  titiler:
    restart: unless-stopped
    image: ghcr.io/developmentseed/titiler:0.18.5
    platform: linux/amd64
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_S3_ENDPOINT: minio:9000
      AWS_VIRTUAL_HOSTING: 'FALSE'
      AWS_HTTPS: 'FALSE'
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
    volumes:
      - local_work:/app/data:ro
      - ${LOCAL_SOURCE_DIR:-./data/sources}:/sources/local:ro
    depends_on:
      minio:
        condition: service_healthy
volumes:
  local_postgres:
  local_objects:
  local_uploads:
  local_work:
